<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇門遁甲 盤デザイン刷新版 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d08;
  --board-border:#b8923a;     /* 盤外枠の金 */
  --card:#15140f;             /* 宮セル背景 */
  --card-empty:#100e09;       /* 中宮 */
  --line:#4a4636;             /* セル枠 */
  --gong:#e6c34a;             /* 宮名（黄） */
  --elem:#8a8678;             /* 五行（小さくグレー） */
  --txt:#e8e8ea;             /* 通常の干（白） */
  --sanki:#7fb0f0;            /* 三奇 乙丙丁（青） */
  --dim:#9aa0ab;              /* 旬首カッコ等 */
  --blue:#4472C4;             /* 八門 吉=青ベタ */
  --red:#FF0000;              /* 八門 凶=赤ベタ */
  --green:#6cd06c;            /* プラス点数 */
  --blue-tx:#7fb0f0;          /* 八神九星 吉=青文字 */
  --red-tx:#ff7a7a;           /* 八神九星 凶／マイナス点数=赤文字 */
  --zod:#c2c8d2;              /* 十二支 */
  --zod-warm:#d98c6a;         /* 上辺・午の暖色 */
  --info-k:#ff7a7a;           /* 象意 凶 */
  --info-g:#7fb0f0;           /* 象意 吉 */
  --info-n:#8a8678;           /* 象意 中立 */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Noto Sans JP',sans-serif;
  padding:18px;
  display:flex;
  justify-content:center;
}
.board-outer{
  border:2px solid var(--board-border);
  border-radius:16px;
  padding:38px 32px;
  position:relative;
  max-width:760px;
  width:100%;
}
/* ===== 外周十二支：配置はそのまま・Notoゴシック・サイズアップ ===== */
.zod{position:absolute;font-size:20px;color:var(--zod);font-weight:500;font-family:'Noto Sans JP',sans-serif;}
.zod.warm{color:var(--zod-warm);}
.z-top1{top:10px;left:25%;}.z-top2{top:10px;left:49%;}.z-top3{top:10px;left:73%;}
.z-l1{left:12px;top:27%;}.z-l2{left:12px;top:49%;}.z-l3{left:12px;top:71%;}
.z-r1{right:12px;top:27%;}.z-r2{right:12px;top:49%;}.z-r3{right:12px;top:71%;}
.z-b1{bottom:10px;left:25%;}.z-b2{bottom:10px;left:49%;}.z-b3{bottom:10px;left:73%;}

/* ===== 宮グリッド：正方形寄り・角丸大きめ ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.cell{
  aspect-ratio:1/1.12;          /* 縦長を解消し正方形寄りに */
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;           /* 角丸大きめ＝丸っこく現代風 */
  padding:10px 12px;
  display:flex;
  flex-direction:column;
}
.cell.junri{border:3px solid var(--blue);}  /* 順利は青枠のみ・文字なし */
.cell.empty{background:var(--card-empty);align-items:center;justify-content:center;color:#6a665a;font-size:30px;}

/* ヘッダー：宮名(明朝・黄) ＋ 五行(小・グレー) / 点数(右・大) */
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
.gong-name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:21px;color:var(--gong);}
.gong-elem{font-size:10px;color:var(--elem);margin-left:2px;}
.score{font-size:25px;font-weight:900;line-height:1;}     /* 点数を枠内で大きく */
.score.good{color:var(--green);}
.score.bad{color:var(--red-tx);}

/* ===== ❹❺ 天盤干=八神 / 地盤干=九星 を同じ高さ・同じ行に2×2で揃える ===== */
.kanmeta{display:grid;grid-template-columns:1fr 1fr;align-items:center;row-gap:2px;}
.kan{font-size:21px;font-weight:900;line-height:1.12;}      /* 干は括弧有無で変えない固定サイズ */
.kan.white{color:var(--txt);}
.kan.sanki{color:var(--sanki);}                              /* 三奇 乙丙丁=青 */
.kan .dim{color:var(--dim);}                                 /* 旬首カッコ（現状維持・(庚)表記） */
.meta{font-size:16px;font-weight:700;text-align:right;line-height:1.12;}
.meta.good{color:var(--blue-tx);}
.meta.bad{color:var(--red-tx);}

/* 八門：色ベタ白抜き・干八神の下に中央寄せ(案A)・Black */
.mon-row{margin-top:8px;text-align:center;}
.mon{display:inline-block;font-weight:900;font-size:20px;color:#fff;padding:5px 15px;border-radius:9px;line-height:1;}
.mon.blue{background:var(--blue);}
.mon.red{background:var(--red);}

/* 象意：最下に小さく */
.info{margin-top:auto;padding-top:5px;font-size:11px;line-height:1.5;}
.info div{white-space:nowrap;}
.info .k{color:var(--info-k);}
.info .g{color:var(--info-g);}
.info .n{color:var(--info-n);}

/* スマホ調整 */
@media (max-width:480px){
  body{padding:10px;}
  .board-outer{padding:32px 24px;}
  .zod{font-size:17px;}
  .cell{padding:8px 9px;border-radius:14px;}
  .gong-name{font-size:18px;}
  .score{font-size:21px;}
  .kan{font-size:18px;}
  .meta{font-size:14px;}
  .mon{font-size:17px;padding:4px 11px;}
  .info{font-size:10px;}
}
</style>
</head>
<body>
<div class="board-outer">

  <span class="zod warm z-top1">巳</span><span class="zod warm z-top2">午</span><span class="zod warm z-top3">未</span>
  <span class="zod z-l1">辰</span><span class="zod z-l2">卯</span><span class="zod z-l3">寅</span>
  <span class="zod z-r1">申</span><span class="zod z-r2">酉</span><span class="zod z-r3">戌</span>
  <span class="zod z-b1">丑</span><span class="zod z-b2">子</span><span class="zod z-b3">亥</span>

  <div class="grid">

    <div class="cell">
      <div class="hd"><div><span class="gong-name">巽</span><span class="gong-elem">木</span></div><div class="score good">5</div></div>
      <div class="kanmeta">
        <div class="kan sanki">丁</div><div class="meta good">九天</div>
        <div class="kan sanki">乙</div><div class="meta bad">天芮</div>
      </div>
      <div class="mon-row"><span class="mon red">傷門</span></div>
      <div class="info"><div class="g">○人遁吉格</div><div class="n">△青龍合霊</div><div class="g">○丁奇得使</div></div>
    </div>

    <div class="cell">
      <div class="hd"><div><span class="gong-name">離</span><span class="gong-elem">火</span></div><div class="score bad">-80</div></div>
      <div class="kanmeta">
        <div class="kan white"><span class="dim">(</span>庚<span class="dim">)</span></div><div class="meta good">直符</div>
        <div class="kan white">壬</div><div class="meta bad">天柱</div>
      </div>
      <div class="mon-row"><span class="mon red">杜門</span></div>
      <div class="info"><div class="k">×金華水流</div><div class="k">×日格</div><div class="k">×伏干</div></div>
    </div>

    <div class="cell">
      <div class="hd"><div><span class="gong-name">坤</span><span class="gong-elem">土</span></div><div class="score bad">-10</div></div>
      <div class="kanmeta">
        <div class="kan"><span class="white" style="color:var(--txt)">己</span> <span style="color:var(--sanki)">丁</span></div><div class="meta good">螣蛇</div>
        <div class="kan white">戊</div><div class="meta good">天心</div>
      </div>
      <div class="mon-row"><span class="mon blue">景門</span></div>
      <div class="info"><div class="n">△朱雀入墓</div><div class="n">△犬遇青龍</div><div class="k">×六儀撃刑格</div></div>
    </div>

    <div class="cell junri">
      <div class="hd"><div><span class="gong-name">震</span><span class="gong-elem">木</span></div><div class="score good">50</div></div>
      <div class="kanmeta">
        <div class="kan white">壬</div><div class="meta good">九地</div>
        <div class="kan sanki">丙</div><div class="meta bad">天英</div>
      </div>
      <div class="mon-row"><span class="mon blue">生門</span></div>
      <div class="info"><div class="k">×水蛇入火</div></div>
    </div>

    <div class="cell empty">—</div>

    <div class="cell">
      <div class="hd"><div><span class="gong-name">兌</span><span class="gong-elem">金</span></div><div class="score bad">-30</div></div>
      <div class="kanmeta">
        <div class="kan white">癸</div><div class="meta good">太陰</div>
        <div class="kan white"><span class="dim">(</span>庚<span class="dim">)</span></div><div class="meta bad">天蓬</div>
      </div>
      <div class="mon-row"><span class="mon red">死門</span></div>
      <div class="info"><div class="k">×太白入網</div></div>
    </div>

    <div class="cell">
      <div class="hd"><div><span class="gong-name">艮</span><span class="gong-elem">土</span></div><div class="score good">40</div></div>
      <div class="kanmeta">
        <div class="kan sanki">乙</div><div class="meta bad">朱雀</div>
        <div class="kan white">辛</div><div class="meta good">天輔</div>
      </div>
      <div class="mon-row"><span class="mon blue">休門</span></div>
      <div class="info"><div class="k">×青龍逃走</div><div class="g">○雲遁</div><div class="g">○虎遁</div><div class="k">×青龍逃走</div></div>
    </div>

    <div class="cell junri">
      <div class="hd"><div><span class="gong-name">坎</span><span class="gong-elem">水</span></div><div class="score good">40</div></div>
      <div class="kanmeta">
        <div class="kan sanki">丙</div><div class="meta bad">勾陳</div>
        <div class="kan white">癸</div><div class="meta bad">天冲</div>
      </div>
      <div class="mon-row"><span class="mon blue">開門</span></div>
      <div class="info"><div class="k">×華蓋孛師</div><div class="g">○丙奇得使</div></div>
    </div>

    <div class="cell">
      <div class="hd"><div><span class="gong-name">乾</span><span class="gong-elem">金</span></div><div class="score bad">-20</div></div>
      <div class="kanmeta">
        <div class="kan white">辛</div><div class="meta good">六合</div>
        <div class="kan white">己</div><div class="meta good">天任</div>
      </div>
      <div class="mon-row"><span class="mon red">驚門</span></div>
      <div class="info"><div class="k">×入獄自刑</div></div>
    </div>

  </div>
</div>
</body>
</html>
